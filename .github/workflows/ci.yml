name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  daemon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check formatting
        run: git ls-files '*.zig' | xargs zig fmt --check

      - name: Bootstrap DuckDB
        run: ./scripts/bootstrap-duckdb.sh

      - name: Preflight
        run: ./scripts/preflight.sh

      - name: Build
        run: zig build

      - name: Unit tests
        run: LD_LIBRARY_PATH=lib zig build test

      - name: Build/test matrix (store gating + ldd-clean minimal)
        # Runs the -Dstore=true/false legs and asserts the minimal build links no
        # native deps. The ner=true leg auto-skips here (lib/libpf.so absent;
        # bootstrapped from source locally via scripts/bootstrap-ner.sh).
        run: ZIG="zig" LD_LIBRARY_PATH=lib ./scripts/test-matrix.sh

      - name: Resource benchmark
        run: LD_LIBRARY_PATH=lib zig build bench
