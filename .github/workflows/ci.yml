name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  daemon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Check formatting
        run: git ls-files '*.zig' | xargs zig fmt --check

      - name: Bootstrap DuckDB
        run: ./scripts/bootstrap-duckdb.sh

      - name: Preflight
        run: ./scripts/preflight.sh

      - name: Build
        run: zig build

      - name: Unit tests
        run: LD_LIBRARY_PATH=lib zig build test

      - name: Resource benchmark
        run: LD_LIBRARY_PATH=lib zig build bench

      - name: Local retained-log protocol fixture
        run: |
          zig build -Dversion=0.0.2
          LD_LIBRARY_PATH=lib python3 scripts/test-host-log-protocol.py
          LD_LIBRARY_PATH=lib python3 scripts/test-https-transport.py
