name: Release

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Validate ${{ matrix.arch }} release archive
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.2' }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release archives
        run: |
          scripts/package-release.sh --version "$VERSION" --target "${{ matrix.arch }}-linux-gnu" --out-dir dist

      - name: Verify release archive checksums
        run: |
          cd dist
          sha256sum -c *.sha256

      - name: Exercise the packaged binaries without host library overrides
        run: |
          mkdir -p .zig-cache/unpacked
          tar -xzf dist/*.tar.gz -C .zig-cache/unpacked
          package="$PWD/.zig-cache/unpacked/sermon-$VERSION-${{ matrix.arch }}-linux-gnu"
          python3 scripts/verify-release.py "$package" "${{ matrix.arch }}-linux-gnu"
          unset LD_LIBRARY_PATH
          export SERMON_AGENT="$package/bin/sermon-agent" SERMON_VERSION="$VERSION"
          "$package/bin/sermon" --help
          python3 scripts/test-https-transport.py
          python3 scripts/test-host-log-protocol.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify both validated archives arrived
        run: |
          cd dist
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum -c *.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Sermon Daemon ${GITHUB_REF_NAME}" \
            --verify-tag
